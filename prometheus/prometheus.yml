# yaml-language-server: $schema=./prometheus.schema.json
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  # Go-микросервисы (go-zero: Prometheus.Port в etc/<name>.yaml)
  - job_name: go-services
    static_configs:
      - targets: ["ping:9091"]
