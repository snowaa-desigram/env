# ЕДИНАЯ ТОЧКА НАСТРОЙКИ. Отсюда генерируется enviropment/.env (make configure).
# Секреты — в inventory/group_vars/<group>/vault.yml (ansible-vault), см. vault.yml.example.
#
# Переименование проекта — три переменные:
#   project_name — техническое имя: docker-сеть, имена образов (<project_name>/core), папка деплоя
#   app_name     — то, что видит пользователь: заголовок сайта, тема писем
#   domain       — домен (local.yml / prod.yml переопределяют); от него считаются api.<domain>, почта, ACME, CORS

project_name: gram-designer
app_name: Gram Designer
# папка с compose-файлами (в монорепе — сабмодуль enviropment; в CI репозитория env — его корень)
env_dir: "{{ deploy_dir }}/enviropment"
repo_url: git@github.com:snowaa-desigram/desigram.git
repo_version: main

domain: gram-designer.localhost
public_api_url: "https://api.{{ domain }}"
# Яндекс Метрика: пусто — счётчик не подключается (локалка); prod.yml задаёт номер
metrika_id: ""
http_port: 80
https_port: 443
acme_email: "admin@{{ domain }}"

mysql_database: desigram
mysql_user: desigram
mysql_password: "{{ vault_mysql_password | default('desigram') }}"
mysql_root_password: "{{ vault_mysql_root_password | default('root') }}"
app_secret: "{{ vault_app_secret | default('change_me') }}"
telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
rabbitmq_user: desigram
rabbitmq_password: "{{ vault_rabbitmq_password | default('desigram') }}"

# Auth: access-JWT (HS256) — секрет общий для auth и core, не короче 32 байт (требование php-jwt)
jwt_secret: "{{ vault_jwt_secret | default('change_me_jwt_secret_at_least_32_bytes') }}"
# SMTP для кодов подтверждения (prod — реальный сервер; local — mailpit, см. local.yml)
smtp_host: ""
smtp_port: 587
smtp_user: ""
smtp_password: "{{ vault_smtp_password | default('') }}"
smtp_from: "no-reply@{{ domain }}"
smtp_tls: true

# Go-сервисы (go-zero): режим и OTLP-endpoint для трейсов (пусто — выключено)
go_mode: pro
otel_endpoint: ""

# Масштабирование: реплики stateless-сервисов (Traefik балансирует между ними)
core_replicas: 1
core_worker_replicas: 1
service_replicas:
  ping: 1
  telegram: 1
  auth: 1

# Rate limit на публичный API (req/s на IP, burst)
core_rate_limit: 50
core_rate_burst: 100
# Rate limit на auth (перебор паролей/кодов) — строже
auth_rate_limit: 10
auth_rate_burst: 20
