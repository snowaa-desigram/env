# Локальная машина — group local. Прод-серверы — group prod; адрес и пользователь заданы в group_vars/prod.yml
# (одно место: prod_server_ip, deploy_user). Несколько серверов — добавить хосты сюда с ansible_host.
all:
  children:
    local:
      hosts:
        laptop:
          ansible_connection: local
          ansible_python_interpreter: auto_silent
    prod:
      hosts:
        server1:
          ansible_host: "{{ prod_server_ip }}"
