services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/certs.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --api.dashboard=true
      - --accesslog=true
      - --accesslog.format=json

      - --metrics.prometheus=true
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics

      - --tracing=true
      - --tracing.otlp.http=true
      - --tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.metrics.rule=Host(`traefik.${DOMAIN}`) && PathPrefix(`/metrics`)
      - traefik.http.routers.metrics.entrypoints=websecure
      - traefik.http.routers.metrics.tls=true
      - traefik.http.routers.metrics.service=prometheus@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs.yml:/etc/traefik/certs.yml:ro
      - ./certificate/local.pem:/local.pem:ro
      - ./certificate/local-key.key:/local-key.key:ro

  database:
    ports:
      - "3307:3306"

  core:
    build:
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ../backend/core:/app
    extra_hosts:
      - host.docker.internal:host-gateway

  core-worker:
    build:
      target: dev
    environment:
      APP_ENV: dev
    volumes:
      - ../backend/core:/app
    # vendor/ ставит core при старте (composer install) — worker ждёт его, иначе стартует раньше vendor/
    depends_on:
      core:
        condition: service_healthy
    command: ["bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=256M"]

  rabbitmq:
    ports:
      - "5673:5672"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.${DOMAIN}`)
      - traefik.http.routers.rabbitmq.entrypoints=websecure
      - traefik.http.routers.rabbitmq.tls=true
      - traefik.http.services.rabbitmq.loadbalancer.server.port=15672

  ping:
    ports:
      - "50051:50051"

  telegram:
    ports:
      - "50052:50051"

  auth:
    ports:
      - "8090:8080"
    depends_on:
      mailpit:
        condition: service_healthy

  # Ловушка для писем (dev/e2e): SMTP 1025, UI и REST API 8025. Auth шлёт коды сюда.
  mailpit:
    image: axllent/mailpit:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.mailpit.rule=Host(`mail.${DOMAIN}`)
      - traefik.http.routers.mailpit.entrypoints=websecure
      - traefik.http.routers.mailpit.tls=true
      - traefik.http.services.mailpit.loadbalancer.server.port=8025
    networks:
      - app

  frontend:
    build:
      context: ../frontend
      dockerfile: ../enviropment/nextjs/Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules

  jaeger:
    image: jaegertracing/jaeger:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.jaeger.rule=Host(`jaeger.${DOMAIN}`)
      - traefik.http.routers.jaeger.entrypoints=websecure
      - traefik.http.routers.jaeger.tls=true
      - traefik.http.services.jaeger.loadbalancer.server.port=16686
    networks:
      - app

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    networks:
      - app

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}:${HTTPS_PORT:-443}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROJECT_NAME:-desigram}
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    networks:
      - app

  redis:
    ports:
      - "6380:6379"

volumes:
  prometheus_data:
  grafana_data:
