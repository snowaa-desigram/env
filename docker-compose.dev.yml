services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/certs.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --api.dashboard=true
      - --accesslog=true
      - --accesslog.format=json

      - --metrics.prometheus=true
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics

      - --tracing=true
      - --tracing.otlp.http=true
      - --tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.dashboard.rule=Host(`traefik.desigram.localhost`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.metrics.rule=Host(`traefik.desigram.localhost`) && PathPrefix(`/metrics`)
      - traefik.http.routers.metrics.entrypoints=websecure
      - traefik.http.routers.metrics.tls=true
      - traefik.http.routers.metrics.service=prometheus@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs.yml:/etc/traefik/certs.yml:ro
      - ./certificate/local.pem:/local.pem:ro
      - ./certificate/local-key.key:/local-key.key:ro

  database:
    ports:
      - "3307:3306"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../enviropment/nextjs/Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: https://api.desigram.localhost:8443

  jaeger:
    image: jaegertracing/jaeger:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.jaeger.rule=Host(`jaeger.desigram.localhost`)
      - traefik.http.routers.jaeger.entrypoints=websecure
      - traefik.http.routers.jaeger.tls=true
      - traefik.http.services.jaeger.loadbalancer.server.port=16686
    networks:
      - app

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.prometheus.rule=Host(`prometheus.desigram.localhost`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    networks:
      - app

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: https://grafana.desigram.localhost:8443
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.grafana.rule=Host(`grafana.desigram.localhost`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    networks:
      - app

volumes:
  prometheus_data:
  grafana_data:
