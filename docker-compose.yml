# Базовая конфигурация. Все параметры — из .env (генерируется Ansible из ansible/inventory/group_vars).
# Микросервисы — по файлу на сервис в services/ (см. `make new-service`).
include:
  - path: services/ping.yml
  - path: services/telegram.yml

services:
  traefik:
    image: traefik:v3.6
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app

  # Очередь (Messenger async → core-worker). Redis — только кеш.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app

  database:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app

  # Symfony (DDD) — единственный публичный API. Stateless: масштабируется репликами.
  core:
    build:
      context: ../backend/core
      dockerfile: ../../enviropment/php/Dockerfile
      target: prod
    environment: &core-env
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@database:3306/${MYSQL_DATABASE}?serverVersion=9.4&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f/messages
      PING_GRPC_ADDR: ping:50051
      TELEGRAM_GRPC_ADDR: telegram:50051
      # браузер ходит с ${DOMAIN} на api.${DOMAIN}
      CORS_ALLOW_ORIGIN: ^https://${DOMAIN}(:[0-9]+)?$$
    deploy:
      replicas: ${CORE_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.core.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.core.entrypoints=websecure
      - traefik.http.routers.core.tls=true
      - traefik.http.routers.core.middlewares=core-ratelimit
      - traefik.http.services.core.loadbalancer.server.port=8080
      - traefik.http.services.core.loadbalancer.healthcheck.path=/health
      - traefik.http.services.core.loadbalancer.healthcheck.interval=10s
      # Защита от перегрузки: req/s на клиента (по IP), сверх — 429
      - traefik.http.middlewares.core-ratelimit.ratelimit.average=${CORE_RATE_LIMIT:-50}
      - traefik.http.middlewares.core-ratelimit.ratelimit.burst=${CORE_RATE_BURST:-100}
    networks:
      - app
    restart: unless-stopped

  # Обработчик очереди (Messenger async → Redis). Тяжёлые команды выполняются здесь, не в HTTP.
  core-worker:
    build:
      context: ../backend/core
      dockerfile: ../../enviropment/php/Dockerfile
      target: prod
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    environment: *core-env
    deploy:
      replicas: ${CORE_WORKER_REPLICAS:-1}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../enviropment/nextjs/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      # для SSR/route handlers — напрямую в core по docker-сети
      API_URL_INTERNAL: http://core:8080
    labels:
      - traefik.enable=true
      - traefik.docker.network=desigram
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks:
      - app
    restart: unless-stopped

volumes:
  database_data:
  redis_data:
  rabbitmq_data:

networks:
  app:
    name: desigram
    driver: bridge
